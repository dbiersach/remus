# Remus6-Rust: Remus6 rewritten in Rust.
#
# Each file in src/ is named after the Remus6 Python file it matches, and main.rs
# matches uci.py. The engine searches the same tree as Remus6, position for position,
# when table replacement does not intervene. Both languages budget half the installed
# RAM; their storage and replacement policies differ.
[package]
name = "remus6_rust"
description = "Remus6 in Rust: the same search and evaluation, many times faster"
version = "1.0.0"
edition = "2024"

# HTTPS and JSON belong only to the tablebase boundary.
[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "query"] }
serde_json = "1"
httpdate = "1"

# The release profile, every switch set for speed:
#   opt-level = 3      the highest optimization level
#   codegen-units = 1  compile the program as one piece, so any function can be inlined
#   lto = "fat"        optimize across every module at link time
#   panic = "abort"    leave out the code that unwinds the stack after a bug
#   strip = true       leave the symbol table out of the program
[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
debug = false
strip = true
