# Remus5-Rust: Remus5 rewritten in Rust.
#
# Each file in src/ is named after the Remus5 Python file it matches, and main.rs
# matches uci.py. The engine searches the same tree as Remus5, position for position,
# when table replacement does not intervene. Both languages budget half the installed
# RAM; their storage and replacement policies differ.
[package]
name = "remus5_rust"
description = "Remus5 in Rust: the same search and evaluation, many times faster"
version = "1.0.0"
edition = "2024"

# Remus5-Rust uses the Rust standard library only, as Remus5 uses Python's.
[dependencies]

# The release profile, every switch set for speed:
#   opt-level = 3      the highest optimization level
#   codegen-units = 1  compile the program as one piece, so any function can be inlined
#   lto = "fat"        optimize across every module at link time
#   panic = "abort"    leave out the code that unwinds the stack after a bug
#   strip = true       leave the symbol table out of the program
[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
debug = false
strip = true
